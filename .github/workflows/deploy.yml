name: Deploy customer site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Customer build only. rep.html and rep-forms/ are never part of this output.
      - run: npm run build
        env:
          VITE_BASE: /lexington-onboarding/
          VITE_WEB3FORMS_KEY: ${{ secrets.VITE_WEB3FORMS_KEY }}
          VITE_SALES_POLICY_URL: ${{ vars.VITE_SALES_POLICY_URL }}
          VITE_CAPTCHA: ${{ vars.VITE_CAPTCHA }}
      - name: Guard against rep-only files
        run: |
          if ls dist | grep -qi rep; then echo "rep files in dist"; exit 1; fi
          if grep -rq "new-account-checklist" dist; then echo "checklist reference in dist"; exit 1; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
